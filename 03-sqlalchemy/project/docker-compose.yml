services:
  postgres:
    image: postgres:16-alpine
    container_name: tasks-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}

    volumes:
      - ./postgres-data:/var/lib/postgresql/data

    ports:
      - "5432:5432"
